<html>
    <title>Booking Form</title>
    <head>
            <!-- Required meta tags -->
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
            <link rel="icon" href="image/favicon-16x16.png" type="image/png">

            <link rel="stylesheet" href="css/bootstrap.css">
            <link rel="stylesheet" href="vendors/linericon/style.css">
            <link rel="stylesheet" href="css/font-awesome.min.css">

    </head>
    <body>
        <div class="container">
            <div class="row justify-content-end">
                <div class="col-md-6">
                    <div class="my_booking_form">
                        <form action="BookingForm.php" method="POST">
                            <div class="mt-10 border border-1 border-grey" style="padding: 10px; box-shadow: 0px 2px 2px 2px black; border-radius: 6px;">
                                <h2><strong>Booking Form</strong></h2>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="firstname" placeholder="Enter Firstname" required>
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="lastname" placeholder="Enter lastname" required>
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="tel" class="form-control" name="phone" placeholder="Enter phonenumbe" required>
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="email" class="form-control" name="email" placeholder="Enter Email" required>
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="text" class="form-control" name="location" placeholder="Enter Location" required>
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row form-group">
                                    <div class="col-md-11">
                                        <div class="input-group date" id="datepicker">
                                            <input type="date" name="date" class="form-control" required>
                                            <span class="input-group-append">
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-12">
                                        <div class="input-group">
                                            <input type="hidden" name="service_name"  value="Tax Consultancy">
                                        </div>
                                    </div>
                                </div><br>
                                <div class="row">
                                    <div class="col-md-12">
                                        <button type="submit" class="btn btn-warning">Book Now</button>
                                    </div>
                                </div>
                            </div><br>
                        </form>
                    </div>
                </div>
            </div>
        </div>        

            <!-- Optional JavaScript -->
            <!-- jQuery first, then Popper.js, then Bootstrap JS -->
